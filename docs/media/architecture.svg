<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="310" viewBox="0 0 1120 310" role="img" aria-labelledby="title desc">
<title id="title">ECG acquisition and processing architecture</title>
<desc id="desc">ECG electrodes feed analogue conditioning, then the STM32 ADC and digital preprocessing. The processed signal is transmitted to SerialPlot and used for heartbeat detection, heart-rate estimation and an LED display.</desc>
